<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InflationScanner - Bekijk prijsontwikkeling</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Chart.js voor prijsgrafieken -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <!-- QuaggaJS voor barcode scannen -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
</head>
<body>
    <header>
        <h1>🔍 InflationScanner</h1>
        <p class="subtitle">Bekijk hoe productprijzen veranderen over tijd</p>
    </header>

    <main>
        <!-- Zoek- en scansectie -->
        <section class="search-section">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Zoek product op naam of barcode...">
                <button id="searchBtn">Zoeken</button>
                <button id="scanBtn" class="scan-btn">📷 Scan barcode</button>
            </div>

            <!-- Barcode scanner (verborgen tot activatie) -->
            <div id="scannerContainer" class="scanner-container hidden">
                <div id="scanner"></div>
                <button id="closeScannerBtn" class="close-btn">Sluiten</button>
            </div>

            <!-- Zoekresultaten -->
            <div id="searchResults" class="search-results"></div>
        </section>

        <!-- Prijsgeschiedenis sectie -->
        <section id="priceHistorySection" class="price-history hidden">
            <h2 id="productTitle"></h2>
            <div class="price-summary">
                <div class="price-card">
                    <span class="label">Huidige prijs</span>
                    <span id="currentPrice" class="price"></span>
                </div>
                <div class="price-card">
                    <span class="label">Oudste prijs</span>
                    <span id="oldestPrice" class="price"></span>
                </div>
                <div class="price-card">
                    <span id="changeLabel" class="label">Verandering</span>
                    <span id="priceChange" class="price change"></span>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </section>

        <!-- Prijs toevoegen -->
        <section class="add-price-section">
            <h2>Prijs toevoegen</h2>
            <form id="addPriceForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="productName">Productnaam *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productBarcode">Barcode</label>
                        <input type="text" id="productBarcode">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productCategory">Categorie</label>
                        <select id="productCategory">
                            <option value="">Selecteer...</option>
                            <option value="voeding">Voeding</option>
                            <option value="dranken">Dranken</option>
                            <option value="zuivel">Zuivel</option>
                            <option value="brood">Brood & Gebak</option>
                            <option value="vlees">Vlees & Vis</option>
                            <option value="groente">Groente & Fruit</option>
                            <option value="huishouden">Huishouden</option>
                            <option value="verzorging">Verzorging</option>
                            <option value="horeca">Horeca</option>
                            <option value="overig">Overig</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="originCountry">Land van herkomst</label>
                        <select id="originCountry">
                            <option value="">Selecteer...</option>
                            <!-- Wordt dynamisch gevuld door app.js -->
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="storeName">Winkel</label>
                        <input type="text" id="storeName" placeholder="bijv. Albert Heijn">
                    </div>
                    <div class="form-group">
                        <label for="storeCountry">Land van winkel</label>
                        <select id="storeCountry">
                            <option value="">Selecteer...</option>
                            <!-- Wordt dynamisch gevuld door app.js -->
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="productPrice">Prijs *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="priceCurrency">Valuta</label>
                        <select id="priceCurrency">
                            <optgroup label="Meest gebruikt">
                                <option value="EUR">EUR - Euro (€)</option>
                                <option value="USD">USD - US Dollar ($)</option>
                                <option value="GBP">GBP - Brits Pond (£)</option>
                            </optgroup>
                            <optgroup label="Amerika">
                                <option value="ARS">ARS - Argentijnse Peso</option>
                                <option value="BOB">BOB - Boliviaanse Boliviano</option>
                                <option value="BRL">BRL - Braziliaanse Real (R$)</option>
                                <option value="CAD">CAD - Canadese Dollar (C$)</option>
                                <option value="CLP">CLP - Chileense Peso</option>
                                <option value="COP">COP - Colombiaanse Peso</option>
                                <option value="CRC">CRC - Costa Ricaanse Colón (₡)</option>
                                <option value="DOP">DOP - Dominicaanse Peso</option>
                                <option value="GTQ">GTQ - Guatemalteekse Quetzal</option>
                                <option value="HNL">HNL - Hondurese Lempira</option>
                                <option value="JMD">JMD - Jamaicaanse Dollar</option>
                                <option value="MXN">MXN - Mexicaanse Peso (MX$)</option>
                                <option value="NIO">NIO - Nicaraguaanse Córdoba</option>
                                <option value="PAB">PAB - Panamese Balboa</option>
                                <option value="PEN">PEN - Peruaanse Sol (S/.)</option>
                                <option value="PYG">PYG - Paraguayaanse Guaraní (₲)</option>
                                <option value="TTD">TTD - Trinidad en Tobago Dollar</option>
                                <option value="UYU">UYU - Uruguayaanse Peso</option>
                                <option value="VES">VES - Venezolaanse Bolívar</option>
                            </optgroup>
                            <optgroup label="Europa">
                                <option value="BGN">BGN - Bulgaarse Lev</option>
                                <option value="CHF">CHF - Zwitserse Frank (Fr)</option>
                                <option value="CZK">CZK - Tsjechische Kroon (Kč)</option>
                                <option value="DKK">DKK - Deense Kroon (kr)</option>
                                <option value="GEL">GEL - Georgische Lari (₾)</option>
                                <option value="HUF">HUF - Hongaarse Forint (Ft)</option>
                                <option value="ISK">ISK - IJslandse Kroon</option>
                                <option value="NOK">NOK - Noorse Kroon (kr)</option>
                                <option value="PLN">PLN - Poolse Zloty (zł)</option>
                                <option value="RON">RON - Roemeense Leu</option>
                                <option value="RUB">RUB - Russische Roebel (₽)</option>
                                <option value="SEK">SEK - Zweedse Kroon (kr)</option>
                                <option value="UAH">UAH - Oekraïense Grivna (₴)</option>
                            </optgroup>
                            <optgroup label="Azië & Oceanië">
                                <option value="AUD">AUD - Australische Dollar (A$)</option>
                                <option value="BDT">BDT - Bengalese Taka (৳)</option>
                                <option value="CNY">CNY - Chinese Yuan (¥)</option>
                                <option value="HKD">HKD - Hongkongse Dollar</option>
                                <option value="IDR">IDR - Indonesische Rupiah (Rp)</option>
                                <option value="INR">INR - Indiase Roepie (₹)</option>
                                <option value="JPY">JPY - Japanse Yen (¥)</option>
                                <option value="KRW">KRW - Zuid-Koreaanse Won (₩)</option>
                                <option value="LKR">LKR - Sri Lankaanse Roepie</option>
                                <option value="MYR">MYR - Maleisische Ringgit (RM)</option>
                                <option value="NZD">NZD - Nieuw-Zeelandse Dollar (NZ$)</option>
                                <option value="PHP">PHP - Filipijnse Peso (₱)</option>
                                <option value="PKR">PKR - Pakistaanse Roepie (₨)</option>
                                <option value="SGD">SGD - Singaporese Dollar (S$)</option>
                                <option value="THB">THB - Thaise Baht (฿)</option>
                                <option value="TWD">TWD - Taiwanese Dollar (NT$)</option>
                                <option value="VND">VND - Vietnamese Dong (₫)</option>
                            </optgroup>
                            <optgroup label="Midden-Oosten">
                                <option value="AED">AED - VAE Dirham (د.إ)</option>
                                <option value="BHD">BHD - Bahreinse Dinar</option>
                                <option value="EGP">EGP - Egyptisch Pond (E£)</option>
                                <option value="ILS">ILS - Israëlische Sjekel (₪)</option>
                                <option value="IQD">IQD - Iraakse Dinar</option>
                                <option value="IRR">IRR - Iraanse Rial</option>
                                <option value="JOD">JOD - Jordaanse Dinar</option>
                                <option value="KWD">KWD - Koeweitse Dinar</option>
                                <option value="LBP">LBP - Libanees Pond</option>
                                <option value="OMR">OMR - Omaanse Rial</option>
                                <option value="QAR">QAR - Qatarese Rial</option>
                                <option value="SAR">SAR - Saoedische Riyal (﷼)</option>
                                <option value="TRY">TRY - Turkse Lira (₺)</option>
                            </optgroup>
                            <optgroup label="Afrika">
                                <option value="DZD">DZD - Algerijnse Dinar</option>
                                <option value="GHS">GHS - Ghanese Cedi (GH₵)</option>
                                <option value="KES">KES - Keniaanse Shilling (KSh)</option>
                                <option value="MAD">MAD - Marokkaanse Dirham</option>
                                <option value="NGN">NGN - Nigeriaanse Naira (₦)</option>
                                <option value="TND">TND - Tunesische Dinar</option>
                                <option value="XAF">XAF - CFA Franc (Centraal)</option>
                                <option value="XOF">XOF - CFA Franc (West)</option>
                                <option value="ZAR">ZAR - Zuid-Afrikaanse Rand (R)</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="priceDate">Datum</label>
                        <input type="date" id="priceDate">
                    </div>
                    <div class="form-group"></div>
                </div>
                <button type="submit" class="submit-btn">Prijs opslaan</button>
            </form>
            <div id="formMessage" class="form-message hidden"></div>
        </section>

        <!-- Top inflatie producten -->
        <section class="top-inflation">
            <h2>Grootste prijsstijgingen</h2>
            <div id="topInflation" class="inflation-list">
                <p class="empty-state">Voeg prijzen toe om de grootste stijgingen te zien.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>InflationScanner &mdash; Samen bouwen we aan prijstransparantie</p>
    </footer>

    <script src="/static/js/app.js"></script>
</body>
</html>
